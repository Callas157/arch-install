# Transição estática enquanto o GRUB lê kernel/initramfs.
# Reabrir gfxterm remove a janela/decorador do gfxmenu. O clear ocorre
# somente DEPOIS do wallpaper estar definido no terminal de tela cheia.
terminal_output console
terminal_output gfxterm
if background_image $prefix/themes/callas/background.png; then
    clear
fi
set gfxpayload=keep
